<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="BugCase">
  <!--
    Edge Add-ons store logo (300×300), S4-23. The bug-in-shield mark centered on a white card with
    the wordmark, so the store tile reads as one product with the extension icon.
    Source of truth for store/edge/assets/store-logo-300x300.png. Regenerate: `pnpm store:assets`.
  -->
  <rect width="300" height="300" fill="#ffffff"/>

  <!-- Brand mark (bug-in-shield), embedded from design/bugcase-icon.svg via a nested viewBox. -->
  <svg x="60" y="30" width="180" height="180" viewBox="0 0 128 128">
    <path fill="#2563eb" d="M30 20 L98 20 Q108 20 108 30 L108 66 C108 92 90 108 64 118 C38 108 20 92 20 66 L20 30 Q20 20 30 20 Z"/>
    <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round">
      <path d="M60 43 L54 31"/>
      <path d="M68 43 L74 31"/>
      <path d="M48 65 L34 59"/>
      <path d="M47 75 L33 75"/>
      <path d="M48 85 L34 91"/>
      <path d="M80 65 L94 59"/>
      <path d="M81 75 L95 75"/>
      <path d="M80 85 L94 91"/>
    </g>
    <circle fill="#ffffff" cx="64" cy="49" r="7.5"/>
    <ellipse fill="#ffffff" cx="64" cy="74" rx="19" ry="21"/>
    <path stroke="#2563eb" stroke-width="5" stroke-linecap="round" d="M64 58 L64 92"/>
  </svg>

  <text x="150" y="270" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="36" font-weight="800" fill="#0f172a">BugCase</text>
</svg>
