<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" role="img" aria-label="BugCase — Privacy-first bug capture. No backend, no telemetry.">
  <!--
    Chrome Web Store marquee promo tile (1400×560), S4-23. Same mark + palette as the small tile.
    Source of truth for store/chrome/assets/promo-marquee-1400x560.png — regenerate: `pnpm store:assets`.
  -->
  <rect width="1400" height="560" fill="#ffffff"/>
  <rect width="1400" height="12" fill="#2563eb"/>

  <!-- Brand mark (bug-in-shield), embedded from design/bugcase-icon.svg via a nested viewBox. -->
  <svg x="120" y="170" width="220" height="220" viewBox="0 0 128 128">
    <path fill="#2563eb" d="M30 20 L98 20 Q108 20 108 30 L108 66 C108 92 90 108 64 118 C38 108 20 92 20 66 L20 30 Q20 20 30 20 Z"/>
    <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round">
      <path d="M60 43 L54 31"/>
      <path d="M68 43 L74 31"/>
      <path d="M48 65 L34 59"/>
      <path d="M47 75 L33 75"/>
      <path d="M48 85 L34 91"/>
      <path d="M80 65 L94 59"/>
      <path d="M81 75 L95 75"/>
      <path d="M80 85 L94 91"/>
    </g>
    <circle fill="#ffffff" cx="64" cy="49" r="7.5"/>
    <ellipse fill="#ffffff" cx="64" cy="74" rx="19" ry="21"/>
    <path stroke="#2563eb" stroke-width="5" stroke-linecap="round" d="M64 58 L64 92"/>
  </svg>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="410" y="268" font-size="118" font-weight="800" fill="#0f172a">BugCase</text>
    <text x="414" y="336" font-size="42" font-weight="600" fill="#475569">Privacy-first bug capture</text>
    <text x="414" y="410" font-size="30" font-weight="600" fill="#2563eb">No backend  ·  No telemetry  ·  One local ZIP report</text>
  </g>
</svg>
