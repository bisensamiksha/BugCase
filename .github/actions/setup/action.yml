name: Setup
description: Install pnpm, Node (pinned via .nvmrc) with pnpm-store caching, and project dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
