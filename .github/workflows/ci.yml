name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Reusable: release.yml calls this workflow to validate the tagged commit (S4-19).
  workflow_call:

# Least privilege for validation: read the repo, nothing else.
permissions:
  contents: read

# Cancel superseded runs on the same ref to conserve free-tier minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm typecheck:e2e
      - run: pnpm typecheck:workflows

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test
      # S4-05 performance budget: 50 MB report opens to an interactive overview under 2 s.
      - run: pnpm test:perf
      # S4-19 workflow contract tests (parse + required keys + hash-dist determinism).
      - run: pnpm test:workflows

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      # S4-14 size budget: the empty-data report.html must stay under 5 MiB.
      - run: node scripts/check-report-html-size.mjs

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The Chromium project loads the unpacked extension, so it needs a fresh build.
      - name: Build extension (Chromium target)
        if: matrix.browser == 'chromium'
        run: pnpm build:chrome
      # The report.html integration test (S4-16) opens the built self-contained report.html; both
      # browser projects run it, so build the template for both (this job does not run `pnpm build`).
      - name: Build self-contained report.html (report.html integration test)
        run: pnpm --filter @bugcase/report-template build
      - name: Install Playwright browser (${{ matrix.browser }})
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run E2E (${{ matrix.browser }})
        run: pnpm test:e2e:${{ matrix.browser }}
      # Keep the HTML report only on failure, briefly, to debug flakes without bloating storage.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
